# If the repo is renamed to arnaud-schuele.github.io, change this to
# "https://arnaud-schuele.github.io/".
baseURL = "https://arnaud-schuele.github.io/aschuele.github.io/"
title = "Arnaud Schuele"
theme = "hugo-resume"
locale = "en-us"
defaultContentLanguage = "en"
enableGitInfo = false
disableKinds = ["taxonomy", "term", "RSS"]

[params]
# TODO: replace the placeholder values below with real details.
address = "City, Country"
email = "email@example.com"
favicon = "/favicon.ico"
firstName = "Arnaud"
lastName = "Schuele"
profileImage = "img/profile.jpg"
showQr = false
showContact = false
showBoards = false
showCertifications = false
showSocializations = true
# The homepage only shows the About section; publications live on /publications/.
sections = []

# TODO: set the real LinkedIn profile URL.
[[params.handles]]
    name = "LinkedIn"
    link = "https://www.linkedin.com/in/TODO/"

[markup.goldmark.renderer]
  unsafe = true
