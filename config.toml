# If the repo is renamed to arnaud-schuele.github.io, change this to
# "https://arnaud-schuele.github.io/".
baseURL = "https://arnaud-schuele.github.io/aschuele.github.io/"
title = "Arnaud Schuele"
theme = "hugo-resume"
locale = "en-us"
defaultContentLanguage = "en"
PygmentsCodeFences = true
PygmentsCodeFencesGuessSyntax = true
PygmentsStyle = "monokai"
enableGitInfo = false

[params]
# TODO: replace the placeholder values below with real details.
address = "City, Country"
email = "email@example.com"
favicon = "/favicon.ico"
firstName = "Arnaud"
lastName = "Schuele"
phone = ""
profileImage = "img/profile3.jpg"
showQr = true
showContact = true
showBoards = false
showCertifications = false
showSocializations = true
sections = ["skills","publications","creations","contributions","experience","education","blog"]
vcardfields = [
    "name",
    "image",
    "org",
    "email",
    "workemail",
    "phone",
    "url",
    "title"
]

# TODO: add, remove or update social links.
[[params.handles]]
    name = "GitHub"
    link = "https://github.com/arnaud-schuele/"

[[params.handles]]
    name = "LinkedIn"
    link = "https://www.linkedin.com/in/TODO/"

[outputs]
home = ["HTML", "JSON"]

[taxonomies]
tag = "tags"

[mediaTypes]
  [mediaTypes."text/vcard"]
    suffixes = ["vcf"]

[outputFormats]
  [outputFormats.VCard]
    mediaType = "text/vcard"
    baseName = "contact"
    isPlainText = true
    notAlternative = true

[markup.goldmark.renderer]
  unsafe = true
