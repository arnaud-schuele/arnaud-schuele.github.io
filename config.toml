# If the repo is renamed to arnaud-schuele.github.io, change this to
# "https://arnaud-schuele.github.io/".
baseURL = "https://arnaud-schuele.github.io/aschuele.github.io/"
title = "Arnaud Schuele"
theme = "hugo-resume"
locale = "en-us"
defaultContentLanguage = "en"
enableGitInfo = false
disableKinds = ["taxonomy", "term", "RSS"]

[params]
address = "Zürich, Switzerland"
email = "arnaud.schuele@nadel.ethz.ch"
favicon = "/favicon.ico"
firstName = "Arnaud"
lastName = "Schuele"
profileImage = "img/profile.jpg"
showQr = false
showContact = false
showBoards = false
showCertifications = false
showSocializations = true
# The homepage only shows the About section; publications live on /publications/.
sections = []

# Short bio shown on the About page. Markdown is allowed (links, **bold**,
# blank line for a new paragraph).
bio = """
I am a PhD Candidate at ETH Development Economics Group. My research examines the additionality of impact investments in low- and middle-income countries.
"""

[[params.handles]]
    name = "LinkedIn"
    link = "https://www.linkedin.com/in/arnaud-schuele"

# Publications shown on the Research page, in the order listed here.
# Copy a [[params.publications]] block for each paper. Every field except
# title is optional: an empty link hides the "Paper" link, an empty figure
# hides the image. Put figures in static/img/publications/.
# The abstract accepts Markdown.
# TODO: replace the examples with real publications.
[[params.publications]]
    title = "Example Paper Title"
    authors = "A. Schuele, Co-Author One, Co-Author Two"
    link = "https://example.com/paper.pdf"
    figure = "img/publications/placeholder.png"
    abstract = """
The abstract goes here. It can span several paragraphs.
"""

[[params.publications]]
    title = "Another Example Paper (No Link Yet)"
    authors = "A. Schuele, Co-Author"
    link = ""
    figure = "img/publications/placeholder.png"
    abstract = """
Abstract of a paper with no public link yet.
"""

[markup.goldmark.renderer]
  unsafe = true
