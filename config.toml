# The abstract accepts Markdown.
# TODO: replace the examples with real publications.https://example.com/paper.pdf
[[params.publications]]
    title = "How do Impact Investors Compare to Traditional Funders? Insights from Africa"
    authors = "A. Schuele, I. Günther"
    link = "https://dx.doi.org/10.2139/ssrn.7562538"
    figure = "img/publications/percentage_plot.png"
    abstract = """
Impact investors pursue both financial and social objectives. Whether this leads to distinct investment behavior in low-income regions remains an open question. Introducing a dataset of 19,131 private market transactions in Africa between 2015 and 2024, we document how impact investor portfolios differ from those of traditional capital providers and Development Finance Institutions (DFIs). Impact investors tend to concentrate in agriculture, education, and healthcare, and are more likely to fund female-led firms. They are disproportionately active in lower-GDP-per-capita countries and pioneer new industries. However, they do not systematically invest more in markets with higher political or currency risk, nor do they act as early movers in countries with limited prior investment activity. They are also less likely than traditional investors to finance early-stage firms. The firms initially backed by impact investors rarely attract later funding solely from other capital providers. Altogether, our findings suggest that impact investors in Africa expand the financing frontier through their thematic specialization, rather than through catalytic effects.
"""

