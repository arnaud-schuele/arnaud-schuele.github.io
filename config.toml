I am a PhD Candidate at ETH Zurich's Development Economics Group. My research examines the financial additionality of impact investments in low- and middle-income countries.
Alongside my research, I have been working as a Senior Associate at the elea Foundation for Ethics in Globalization. I am currently undertaking a visiting research stay at Columbia University.
"""

